<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SVG 불러오기 예제</title>
</head>
<body>

  <!-- 1. iframe 태그: SVG 내 스크립트가 실행됨 (동일 출처 정책 준수 시) -->
  <h3>1. iframe 사용</h3>
  <iframe src="test.svg" width="150" height="150"></iframe>

  <!-- 2. object 태그: SVG 내 스크립트가 실행됨 -->
  <h3>2. object 사용</h3>
  <object data="test.svg" type="image/svg+xml" width="150" height="150"></object>

  <!-- 3. embed 태그: SVG 내 스크립트가 실행됨 -->
  <h3>3. embed 사용</h3>
  <embed src="test.svg" type="image/svg+xml" width="150" height="150">

  <!-- 4. img 태그: 보안상 이미지로만 렌더링되며 내부 스크립트는 실행되지 않음 -->
  <h3>4. img 태그 사용 (스크립트 실행 안 됨)</h3>
  <img src="test.svg" alt="SVG 이미지" width="150" height="150">

</body>
</html>
